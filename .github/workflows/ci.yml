name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required project files exist
        run: |
          test -f index.html
          test -f styles.css
          test -f src/app.js

      - name: JavaScript syntax check
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
